<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>飞机大战 H5</title>
<style>
  /* ===== 整体页面样式：浅色背景，居中显示游戏 ===== */
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: #eef3f8;
    font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* 游戏外壳：固定比例，细边框（对应图片里的边框） */
  #game-wrap {
    position: relative;
    background: #ffffff;
    border: 2px solid #cdd7e2;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(0,0,0,0.12);
  }

  /* 顶部信息栏：左 得分 / 中 生存时间 / 右 当前生命 */
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    background: rgba(255,255,255,0.82);
    backdrop-filter: blur(2px);
    border-bottom: 1px solid #e3e9f0;
    font-size: 15px;
    font-weight: 600;
    color: #2c3e50;
    z-index: 5;
    pointer-events: none;
  }
  #hud .hud-item { display: flex; flex-direction: column; line-height: 1.2; }
  #hud .hud-label { font-size: 11px; font-weight: 500; color: #8a97a8; }
  #hud .hud-value { font-size: 16px; color: #1f6feb; }
  #hud .hud-value.life { color: #e23b3b; }

  canvas { display: block; touch-action: none; }

  /* 覆盖层：开始 / 结束界面 */
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.9);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    z-index: 10;
  }
  #overlay.hidden { display: none; }
  #overlay h1 { font-size: 30px; color: #1f6feb; margin-bottom: 8px; letter-spacing: 2px; }
  #overlay p { color: #5b6878; font-size: 14px; margin: 4px 0; }
  #overlay .big-score { font-size: 22px; color: #e23b3b; font-weight: 700; margin: 10px 0; }
  #start-btn {
    margin-top: 22px;
    padding: 12px 38px;
    font-size: 17px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg,#1f6feb,#3aa0ff);
    border: none;
    border-radius: 26px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(31,111,235,0.4);
  }
  #start-btn:active { transform: scale(0.96); }
  .tip { margin-top: 16px; font-size: 12px; color: #9aa6b5; }
</style>
</head>
<body>
  <div id="game-wrap">
    <div id="hud">
      <div class="hud-item"><span class="hud-label">得分</span><span class="hud-value" id="score">0</span></div>
      <div class="hud-item" style="align-items:center"><span class="hud-label">生存时间</span><span class="hud-value" id="time">0s</span></div>
      <div class="hud-item" style="align-items:flex-end"><span class="hud-label">当前生命</span><span class="hud-value life" id="life">10</span></div>
    </div>
    <canvas id="canvas"></canvas>
    <div id="overlay">
      <h1>飞机大战</h1>
      <p>拖动屏幕移动飞机 · 自动开火</p>
      <p>躲开敌机与弹幕，击落得分！</p>
      <button id="start-btn">开始游戏</button>
      <div class="tip">支持手机触摸与电脑鼠标</div>
    </div>
  </div>

<script>
/* =========================================================================
   飞机大战 H5 —— 单文件实现
   核心模块：游戏循环 / 玩家 / 子弹 / 敌机 / 碰撞检测 / 难度递增
   逻辑与 C 语言里的“状态机 + 主循环”是一致的，方便你对照学习。
   ========================================================================= */

// ---------- 1. 基本配置与画布初始化 ----------
const W = 400;            // 游戏逻辑宽度（CSS 像素）
const H = 700;            // 游戏逻辑高度
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// 适配高清屏：用 devicePixelRatio 放大画布，再缩回逻辑尺寸，保证不模糊
const dpr = Math.min(window.devicePixelRatio || 1, 2);
canvas.width = W * dpr;
canvas.height = H * dpr;
canvas.style.width = W + 'px';
canvas.style.height = H + 'px';
document.getElementById('game-wrap').style.width = W + 'px';
document.getElementById('game-wrap').style.height = H + 'px';
ctx.scale(dpr, dpr);

// ---------- 1.5 图片素材加载 ----------
const IMAGES = {};
function loadImage(key, src) {
  const im = new Image();
  IMAGES[key] = { img: im, ready: false };
  im.onload = () => { IMAGES[key].ready = true; };
  im.onerror = () => { console.warn('素材加载失败: ' + src); };
  im.src = src;
}

// 以 (cx,cy) 为中心绘制精灵，可旋转；图片未就绪时返回 false 便于兜底
function drawSprite(key, cx, cy, w, h, rot = 0) {
  const s = IMAGES[key];
  if (!s || !s.ready) return false;
  ctx.save();
  ctx.translate(cx, cy);
  if (rot) ctx.rotate(rot);
  ctx.drawImage(s.img, -w / 2, -h / 2, w, h);
  ctx.restore();
  return true;
}

// 圆角矩形路径（给玩家子弹用）
function roundRectPath(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// HUD 元素引用
const elScore = document.getElementById('score');
const elTime  = document.getElementById('time');
const elLife  = document.getElementById('life');
const overlay = document.getElementById('overlay');

// ---------- 2. 游戏状态 ----------
const STATE = { READY: 0, PLAYING: 1, OVER: 2 };
let state = STATE.READY;

let score = 0;            // 得分
let life = 10;            // 当前生命（共 10 点）
let surviveTime = 0;      // 生存时间（秒）
let lastTime = 0;         // 上一帧时间戳
let spawnTimer = 0;       // 敌机生成计时器
let fireTimer = 0;        // 玩家开火计时器
let difficulty = 1;       // 难度系数（随时间提升）

// 用数组存放“实体”，类似 C 里的结构体数组
let bullets = [];         // 玩家子弹列表
let enemyBullets = [];     // 敌机子弹列表
let enemies = [];         // 敌机列表
let particles = [];        // 爆炸火星（纯装饰）
let booms = [];            // 爆炸特效（图片，放大淡出）

// ---------- 3. 玩家飞机 ----------
const player = {
  x: W / 2,
  y: H - 90,
  w: 38,
  h: 42,
  speed: 6,      // 键盘移动速度
  cooldown: 0.28 // 自动开火间隔（秒）
};

// ---------- 4. 输入处理 ----------
const keys = {};          // 记录按键状态
window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
window.addEventListener('keyup',   e => { keys[e.key.toLowerCase()] = false; });

// 触摸 / 鼠标：让飞机跟随手指或鼠标位置（相对偏移，避免“瞬移”）
let dragging = false;
let dragOffsetX = 0, dragOffsetY = 0;

function canvasPos(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  // 把屏幕坐标换算成逻辑坐标
  return {
    x: (clientX - rect.left) * (W / rect.width),
    y: (clientY - rect.top)  * (H / rect.height)
  };
}

function startDrag(clientX, clientY) {
  const p = canvasPos(clientX, clientY);
  dragging = true;
  dragOffsetX = p.x - player.x;
  dragOffsetY = p.y - player.y;
}
function moveDrag(clientX, clientY) {
  if (!dragging) return;
  const p = canvasPos(clientX, clientY);
  player.x = p.x - dragOffsetX;
  player.y = p.y - dragOffsetY;
  clampPlayer();
}
function endDrag() { dragging = false; }

// 触摸事件
canvas.addEventListener('touchstart', e => { e.preventDefault(); const t = e.touches[0]; startDrag(t.clientX, t.clientY); }, {passive:false});
canvas.addEventListener('touchmove',  e => { e.preventDefault(); const t = e.touches[0]; moveDrag(t.clientX, t.clientY); }, {passive:false});
canvas.addEventListener('touchend',   e => { e.preventDefault(); endDrag(); }, {passive:false});
// 鼠标事件（电脑端）
canvas.addEventListener('mousedown', e => startDrag(e.clientX, e.clientY));
canvas.addEventListener('mousemove', e => moveDrag(e.clientX, e.clientY));
window.addEventListener('mouseup', endDrag);

// 限制玩家不出界
function clampPlayer() {
  player.x = Math.max(player.w/2, Math.min(W - player.w/2, player.x));
  player.y = Math.max(H/2, Math.min(H - player.h/2, player.y));
}

// ---------- 5. 生成实体 ----------
function spawnBullet(offset = 0) {
  // 子弹从机头发出（offset 用于多管齐射的横向偏移）
  bullets.push({ x: player.x + offset, y: player.y - player.h/2, w: 4, h: 14, speed: 520 });
}

function spawnEnemy() {
  const size = 26 + Math.random() * 18;           // 敌机大小
  const x = size/2 + Math.random() * (W - size);  // 随机水平位置
  const hp = size > 38 ? 2 : 1;                   // 大飞机更耐打
  const speed = 90 + Math.random() * 70 + difficulty * 12;
  enemies.push({
    x, y: -size, w: size, h: size,
    speed, hp, maxHp: hp,
    sway: Math.random() * Math.PI * 2,   // 左右摆动相位
    swaySpeed: 1 + Math.random() * 1.5,
    canShoot: size > 30,                 // 较大的敌机才会开火
    fireTimer: 1 + Math.random() * 1.5, // 首次开火前的延迟
    fireGap: 1.4 + Math.random() * 0.8  // 两次开火间隔（秒）
  });
}

// 敌机发射子弹（从机头向下方射出，略微朝玩家方向偏移）
function spawnEnemyBullet(e) {
  const dx = player.x - e.x;
  const dy = player.y - e.y;
  const len = Math.hypot(dx, dy) || 1;
  const sp = 220 + difficulty * 10;       // 敌弹速度
  enemyBullets.push({
    x: e.x,
    y: e.y + e.h/2,
    w: 5, h: 12,
    vx: (dx / len) * sp * 0.35,           // 轻微追踪玩家，但主要向下
    vy: sp,
    speed: sp
  });
}

// 火星碎片（小火花）
function explode(x, y, color) {
  for (let i = 0; i < 10; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 60 + Math.random() * 140;
    particles.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 0.5, color });
  }
}

// 大爆炸特效（用 explosion.png 图片，放大 + 淡出）
function bigBoom(x, y, scale = 1) {
  booms.push({ x, y, t: 0, dur: 0.45, scale });
}

// ---------- 6. 更新逻辑（每帧调用一次） ----------
function update(dt) {
  surviveTime += dt;
  difficulty = 1 + surviveTime / 25;   // 难度随时间缓慢上升

  // 键盘移动（电脑端无触摸时可用）
  if (keys['arrowleft'] || keys['a'])  player.x -= player.speed * 60 * dt;
  if (keys['arrowright']|| keys['d'])  player.x += player.speed * 60 * dt;
  if (keys['arrowup']   || keys['w'])  player.y -= player.speed * 60 * dt;
  if (keys['arrowdown'] || keys['s'])  player.y += player.speed * 60 * dt;
  clampPlayer();

  // 自动开火：玩家能力随时间增强（等级越高，子弹越多、射速越快）
  fireTimer -= dt;
  if (fireTimer <= 0) {
    const level = Math.min(3, 1 + Math.floor(surviveTime / 20)); // 每20秒升一级，最多3级
    player.cooldown = Math.max(0.12, 0.28 - level * 0.05);       // 射速提升
    const spread = level === 1 ? [0] : level === 2 ? [-10, 10] : [-16, 0, 16];
    for (const off of spread) spawnBullet(off);                  // 1/2/3 管齐射
    fireTimer = player.cooldown;
  }

  // 子弹移动
  for (const b of bullets) b.y -= b.speed * dt;
  bullets = bullets.filter(b => b.y + b.h > 0);

  // 敌机生成：随时间越来越多（间隔随难度缩短，高难度一次刷出两架）
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnEnemy();
    if (difficulty > 3) spawnEnemy();   // 后期敌机成群出现
    spawnTimer = Math.max(0.3, 1.0 - difficulty * 0.1);
  }

  // 敌机移动（带轻微左右摆动）+ 开火
  for (const e of enemies) {
    e.y += e.speed * dt;
    e.sway += e.swaySpeed * dt;
    e.x += Math.sin(e.sway) * 30 * dt;
    e.x = Math.max(e.w/2, Math.min(W - e.w/2, e.x));

    // 敌机开火：进入画面后，按各自间隔射击
    if (e.canShoot && e.y > 0) {
      e.fireTimer -= dt;
      if (e.fireTimer <= 0) {
        spawnEnemyBullet(e);
        e.fireTimer = e.fireGap / Math.min(2, difficulty * 0.6); // 难度越高射得越密
      }
    }
  }

  // 敌机子弹移动（向下飞）
  for (const b of enemyBullets) {
    b.x += b.vx * dt;
    b.y += b.vy * dt;
  }
  enemyBullets = enemyBullets.filter(b => b.y - b.h/2 < H + 20 &&
                                          b.x > -20 && b.x < W + 20);

  // 碰撞检测：子弹 vs 敌机
  for (const e of enemies) {
    for (const b of bullets) {
      if (b.dead || e.dead) continue;
      if (Math.abs(b.x - e.x) < (e.w/2 + b.w/2) &&
          Math.abs(b.y - e.y) < (e.h/2 + b.h/2)) {
        b.dead = true;
        e.hp -= 1;
        if (e.hp <= 0) {
          e.dead = true;
          score += 10;   // 每击落一架敌机得 10 分（不论大小）
          bigBoom(e.x, e.y, e.maxHp === 2 ? 1.4 : 1);
          explode(e.x, e.y, '#ff7a59');
        } else {
          explode(b.x, b.y, '#ffd166');
        }
      }
    }
  }
  bullets = bullets.filter(b => !b.dead);
  enemies = enemies.filter(e => !e.dead && e.y - e.h/2 < H + 10);

  // 碰撞检测：敌机 vs 玩家
  for (const e of enemies) {
    if (e.dead) continue;
    if (Math.abs(e.x - player.x) < (e.w/2 + player.w/2 - 6) &&
        Math.abs(e.y - player.y) < (e.h/2 + player.h/2 - 6)) {
      e.dead = true;
      life -= 1;
      bigBoom(player.x, player.y, 0.6);
      explode(e.x, e.y, '#ff4d4f');
      if (life <= 0) { gameOver(); return; }
    }
  }
  enemies = enemies.filter(e => !e.dead);

  // 碰撞检测：敌机子弹 vs 玩家
  for (const b of enemyBullets) {
    if (b.dead) continue;
    if (Math.abs(b.x - player.x) < (player.w/2 + b.w/2 - 4) &&
        Math.abs(b.y - player.y) < (player.h/2 + b.h/2 - 4)) {
      b.dead = true;
      life -= 1;
      bigBoom(player.x, player.y, 0.55);
      explode(b.x, b.y, '#ff4d4f');
      if (life <= 0) { gameOver(); return; }
    }
  }
  enemyBullets = enemyBullets.filter(b => !b.dead);

  // 碎片更新
  for (const p of particles) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);

  // 爆炸特效推进
  for (const bm of booms) bm.t += dt;
  booms = booms.filter(bm => bm.t < bm.dur);

  // 刷新 HUD
  elScore.textContent = score;
  elTime.textContent = Math.floor(surviveTime) + 's';
  elLife.textContent = life;
}

// ---------- 7. 绘制 ----------
function drawPlayer() {
  const s = IMAGES.player;
  const dw = 58;                                          // 显示宽度
  const dh = s && s.ready ? dw * (s.img.height / s.img.width) : player.h;
  if (!drawSprite('player', player.x, player.y, dw, dh)) {
    // 兜底：图片未加载时用矢量三角
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.fillStyle = '#1f6feb';
    ctx.beginPath();
    ctx.moveTo(0, -player.h/2);
    ctx.lineTo(player.w/2, player.h/2);
    ctx.lineTo(0, player.h/2 - 8);
    ctx.lineTo(-player.w/2, player.h/2);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
}

function drawEnemy(e) {
  const s = IMAGES.enemy;
  const dw = e.w * 1.5;                                   // 视觉比碰撞盒稍大
  const dh = s && s.ready ? dw * (s.img.height / s.img.width) : e.h;
  if (!drawSprite('enemy', e.x, e.y, dw, dh)) {
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.fillStyle = e.maxHp === 2 ? '#e23b3b' : '#ff7a59';
    ctx.beginPath();
    ctx.moveTo(0, e.h/2);
    ctx.lineTo(e.w/2, -e.h/2);
    ctx.lineTo(0, -e.h/2 + 8);
    ctx.lineTo(-e.w/2, -e.h/2);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
}

function draw() {
  // 背景：使用天空图片，按 cover 方式铺满
  const bg = IMAGES.bg;
  if (bg && bg.ready) {
    const scale = Math.max(W / bg.img.width, H / bg.img.height);
    const dw = bg.img.width * scale, dh = bg.img.height * scale;
    ctx.drawImage(bg.img, (W - dw) / 2, (H - dh) / 2, dw, dh);
  } else {
    ctx.clearRect(0, 0, W, H);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#eaf3ff');
    g.addColorStop(1, '#f7fbff');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  // 敌机
  for (const e of enemies) drawEnemy(e);

  // 敌机子弹：红色能量弹图片，尖端转向速度方向（朝下）
  for (const b of enemyBullets) {
    const bs = IMAGES.bullet;
    const bh = 22;
    const bw = bs && bs.ready ? bh * (bs.img.width / bs.img.height) : b.w;
    const angle = Math.atan2(b.vy, b.vx) + Math.PI / 2;
    if (!drawSprite('bullet', b.x, b.y, bw, bh, angle)) {
      ctx.fillStyle = '#ff3b3b';
      ctx.fillRect(b.x - b.w/2, b.y - b.h/2, b.w, b.h);
    }
  }

  // 玩家子弹：黄色发光能量弹（代码绘制）
  for (const b of bullets) {
    const vw = b.w * 1.6, vh = b.h;
    const g = ctx.createLinearGradient(b.x, b.y - vh/2, b.x, b.y + vh/2);
    g.addColorStop(0, '#fff6c2');
    g.addColorStop(0.5, '#ffd23f');
    g.addColorStop(1, '#ff9f1a');
    ctx.fillStyle = g;
    roundRectPath(b.x - vw/2, b.y - vh/2, vw, vh, vw/2);
    ctx.fill();
  }

  // 玩家
  drawPlayer();

  // 爆炸特效：图片放大 + 淡出
  for (const bm of booms) {
    const p = bm.t / bm.dur;                 // 0..1 进度
    const size = (55 + p * 70) * bm.scale;
    ctx.globalAlpha = Math.max(0, 1 - p);
    if (!drawSprite('explosion', bm.x, bm.y, size, size, 0)) {
      ctx.fillStyle = '#ff7a59';
      ctx.beginPath();
      ctx.arc(bm.x, bm.y, size / 2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // 火星
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / 0.5);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;
}

// ---------- 8. 主循环 ----------
function loop(ts) {
  if (!lastTime) lastTime = ts;
  let dt = (ts - lastTime) / 1000;
  lastTime = ts;
  if (dt > 0.05) dt = 0.05;   // 限制最大步长，防止卡顿后“瞬移”

  if (state === STATE.PLAYING) update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---------- 9. 开始 / 结束 ----------
function resetGame() {
  score = 0; life = 10; surviveTime = 0;
  bullets = []; enemyBullets = []; enemies = []; particles = []; booms = [];
  spawnTimer = 0.6; fireTimer = 0;
  difficulty = 1;
  player.x = W/2; player.y = H - 90;
  elScore.textContent = '0';
  elTime.textContent = '0s';
  elLife.textContent = '10';
}

function startGame() {
  resetGame();
  state = STATE.PLAYING;
  overlay.classList.add('hidden');
}

function gameOver() {
  state = STATE.OVER;
  overlay.classList.remove('hidden');
  overlay.innerHTML = `
    <h1>游戏结束</h1>
    <p>本次成绩</p>
    <div class="big-score">得分 ${score} · 生存 ${Math.floor(surviveTime)}s</div>
    <button id="start-btn">再来一局</button>
    <div class="tip">拖动屏幕移动飞机 · 自动开火</div>`;
  document.getElementById('start-btn').addEventListener('click', startGame);
}

document.getElementById('start-btn').addEventListener('click', startGame);

// 调试/预览用：网址加 ?demo=1 会自动开局并摆放实体，便于检查素材效果
if (location.search.indexOf('demo') >= 0) {
  startGame();
  spawnEnemy(); spawnEnemy(); spawnEnemy();
  enemies.forEach((e, i) => { e.x = 100 + i * 100; e.y = 150 + i * 120; });
  spawnBullet(0); spawnBullet(-10); spawnBullet(10);
  enemyBullets.push({ x: 150, y: 320, w: 5, h: 12, vx: 0, vy: 200, speed: 200 });
  enemyBullets.push({ x: 260, y: 380, w: 5, h: 12, vx: 0, vy: 200, speed: 200 });
  bigBoom(300, 250, 1.2);
  player.x = W / 2; player.y = H - 130;
}
</script>
